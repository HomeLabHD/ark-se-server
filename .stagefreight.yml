version: 1

ci:
  image: docker.cr.pcfae.com/prplanit/stagefreight:latest-dev

git:
  branches:
    main: "^master$"
  tags:
    stable:     { pattern: "^v?\\d+\\.\\d+\\.\\d+$" }
    prerelease: { pattern: "^v?\\d+\\.\\d+\\.\\d+-.+" }
  versioning:
    branch_builds:
      default: { base_from: [stable], format: "{base}-dev+{sha}" }
    no_lineage: { mode: error }

vars:
  org: hlhd
  github_org: HomeLabHD
  gitlab_group: PrPlanIT/HomeLabHD
  repo: ark-se-server

forges:
  gitlab:
    provider: gitlab
    url: "https://gitlab.prplanit.com"
    credentials: GITLAB

repos:
  primary:
    forge: gitlab
    project: "{var:gitlab_group}/{var:repo}"
    roles: [primary]
    branches:
      default: master
    worktree: "."

builds:
  ark-se-server:
    kind: docker
    platforms: [linux/amd64]

registries:
  dockerhub:
    provider: docker
    url: docker.io
    credentials: DOCKER
    default_path: "{var:org}/{var:repo}"

publish:
  # ── Docker Hub: stable releases ─────────────────────────────────
  stable:
    kind: registry
    registry: [dockerhub]
    build: ark-se-server
    tags: ["{version}", "latest"]
    when: { git_tags: [stable], events: [tag] }

  # ── Docker Hub: pre-releases ────────────────────────────────────
  prerelease:
    kind: registry
    registry: [dockerhub]
    build: ark-se-server
    tags: ["{version}"]
    when: { git_tags: [prerelease], events: [tag] }

  # ── Docker Hub: dev builds on every commit ──────────────────────
  dev:
    kind: registry
    registry: [dockerhub]
    build: ark-se-server
    tags: ["dev-{sha:8}", "latest-dev"]
    when: { branches: [main], events: [push] }
    retention:
      keep_last: 6
      protect: ["latest-dev"]

  # ── Docker Hub: project metadata / README sync ──────────────────
  project-metadata:
    kind: metadata
    registry: [dockerhub]
    readme: README.md
    description:
      - "ARK: Survival Evolved dedicated server with arkmanager, RCON health endpoint, and cron-based automation."
    when: { branches: [main], events: [push, tag] }

  # ── Primary release (GitLab) ────────────────────────────────────
  primary-release:
    kind: release
    type: latest
    repos: [primary]
    aliases: ["{version}", "latest"]
    when: { git_tags: [stable], events: [tag] }

commit:
  default_type: docs
  conventional: true
  backend: git

lint:
  level: full
  modules:
    freshness:
      enabled: true
      cache_ttl: 300
      sources:
        docker_images: true
    tabs:
      enabled: true
    secrets:
      enabled: true
    conflicts:
      enabled: true
    filesize:
      enabled: true

security:
  enabled: true
  sbom: true
  release_detail: full

# stencils: define each renderable once (id → stencil def). Inline defs render a
# badge (default, SVG via output:) or a shield (render: shield); named producers
# render via type. Shared by scribe.
stencils:
  # ── generated badges (SVG output) ──
  build:           { label: build,      message: "{env:BUILD_STATUS}", color: auto, font: monofur, output: ".stagefreight/badges/build.svg", link: "https://gitlab.prplanit.com/{var:gitlab_group}/{var:repo}/-/pipelines" }
  license:         { label: license,    message: "MIT", color: "#310937", font: monofur, output: ".stagefreight/badges/license.svg", link: "https://github.com/{var:github_org}/{var:repo}/blob/master/LICENSE" }
  release:         { label: release,    message: "v{base}", color: "#74ecbe", font: dejavu-sans, font_size: 11, output: ".stagefreight/badges/release.svg", link: "https://github.com/{var:github_org}/{var:repo}/releases" }
  updated:         { label: updated,    message: "{env:BUILD_DATE}", color: "#236144", font: dejavu-sans, font_size: 11, output: ".stagefreight/badges/updated.svg" }
  pulls:           { label: pulls,      message: "{docker.pulls}", color: "#1d63ed", output: ".stagefreight/badges/pulls.svg", link: "https://hub.docker.com/r/{var:org}/{var:repo}" }
  latest:          { label: latest,     message: "v{base}", color: "#74ecbe", output: ".stagefreight/badges/latest.svg", link: "https://hub.docker.com/r/{var:org}/{var:repo}/tags?name=latest" }
  release-updated: { label: updated,    message: "{docker.tag.v{base}.updated}", color: "#236144", output: ".stagefreight/badges/release-updated.svg" }
  release-size:    { label: size,       message: "{docker.tag.v{base}.size}", color: "#555", output: ".stagefreight/badges/release-size.svg", link: "https://hub.docker.com/r/{var:org}/{var:repo}/tags?name=v{base}" }
  latest-dev:      { label: latest-dev, message: "dev-{sha:8}", color: "#3b82f6", output: ".stagefreight/badges/latest-dev.svg", link: "https://hub.docker.com/r/{var:org}/{var:repo}/tags?name=latest-dev" }
  dev-updated:     { label: updated,    message: "{docker.tag.latest-dev.updated}", color: "#236144", output: ".stagefreight/badges/dev-updated.svg" }
  dev-size:        { label: size,       message: "{docker.tag.latest-dev.size}", color: "#555", output: ".stagefreight/badges/dev-size.svg", link: "https://hub.docker.com/r/{var:org}/{var:repo}/tags?name=latest-dev" }

  # ── inline shields ──
  donate:   { render: shield, message: donate,  color: "#FF5E5B", logo: ko-fi,          logo_color: white, link: "https://ko-fi.com/T6T41IT163" }
  sponsor:  { render: shield, message: sponsor, color: "#EA4AAA", logo: githubsponsors, logo_color: white, link: "https://github.com/sponsors/{var:github_org}" }
  github:   { render: shield, label: GitHub, message: source, color: "#181717", logo: github, link: "https://github.com/{var:github_org}/{var:repo}" }
  gitlab:   { render: shield, label: GitLab, message: source, color: "#FC6D26", logo: gitlab, link: "https://gitlab.prplanit.com/{var:gitlab_group}/{var:repo}" }
  docker:   { render: shield, label: Docker, message: "{var:org}/{var:repo}", color: "#2496ED", logo: docker, logo_color: white, link: "https://hub.docker.com/r/{var:org}/{var:repo}" }
  prs-open: { render: shield, shield: "github/issues-pr/{var:github_org}/{var:repo}" }

  # ── named producers ──
  last-commit:  { type: github-last-commit,  params: { repo: "{var:github_org}/{var:repo}" } }
  issues-open:  { type: github-issues-open,  params: { repo: "{var:github_org}/{var:repo}" } }
  contributors: { type: github-contributors, params: { repo: "{var:github_org}/{var:repo}" } }

scribe:
  # files: one placement region per marked span; items are stencil name-refs
  # ("br" inserts a line break).
  files:
    readme.badges:
      file: "README.md"
      link_base: "https://github.com/{var:github_org}/{var:repo}/blob/master"
      between: ["<!-- sf:badges:start -->", "<!-- sf:badges:end -->"]
      inline: true
      items: [build, license, release, updated, donate, sponsor]

    readme.project:
      file: "README.md"
      link_base: "https://github.com/{var:github_org}/{var:repo}/blob/master"
      between: ["<!-- sf:project:start -->", "<!-- sf:project:end -->"]
      inline: true
      items: [github, gitlab, last-commit, issues-open, prs-open, contributors]

    readme.image:
      file: "README.md"
      link_base: "https://github.com/{var:github_org}/{var:repo}/blob/master"
      between: ["<!-- sf:image:start -->", "<!-- sf:image:end -->"]
      items: [docker, pulls, br, latest, release-updated, release-size, latest-dev, dev-updated, dev-size]

  commit:
    type: docs
    message: "refresh generated docs and badges"
    add:
      - "README.md"
      - ".stagefreight/badges"
      - ".stagefreight/scribe"
    push: true
    skip_ci: true
